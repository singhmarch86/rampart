name: Release

# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Publishes the Docker image to ghcr.io and creates a GitHub Release with
# auto-generated notes. A tag with a hyphen (v0.1.0-rc1) is published as a
# pre-release and does NOT move the `latest` image tag, so a release
# candidate can be used to test this pipeline without affecting `latest`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $flag
