# Rampart configuration. Copy to rampart.yaml and adjust for your deployment.

# Address Rampart itself listens on.
listen: ":8080"

# Terminate TLS directly on Rampart's listeners (both the main proxy above
# and the dashboard below, if enabled) using your own cert/key files — no
# automatic certificate provisioning (no ACME/Let's Encrypt integration).
# Bring a cert from Let's Encrypt (e.g. via certbot) or your own CA.
# Leave disabled if TLS is already terminated upstream of Rampart (a load
# balancer, an Ingress controller, Cloudflare) — that's the more common
# setup and this is not required in that case.
tls:
  enabled: false
  cert_file: ""
  key_file: ""

# The application Rampart protects. All allowed traffic is proxied here.
upstream: "http://localhost:3000"

firewall:
  # If non-empty, ONLY these CIDRs/IPs may reach the upstream. Leave empty to allow all
  # (subject to deny below).
  allow: []
  # Always blocked, even if allow is empty. Example: block a known-bad range.
  deny: []
  # - "203.0.113.0/24"

waf:
  enabled: true
  # "block" enforces; "detect" logs matches without blocking (use this first when
  # tuning a new deployment, to see what CRS would have blocked before enforcing).
  mode: "block"
  # Directory of custom SecLang (.conf) rules, applied after the OWASP Core Rule Set.
  custom_rules_dir: "configs/waf-custom-rules"
  # 0 uses Coraza's defaults (10MB request / 5MB response).
  request_body_limit: 0
  response_body_limit: 0

# Detects credential stuffing and token abuse: repeated authentication
# failures from the same IP against a configured endpoint get temporarily
# blocked. Configure a rule per auth-gated route you want watched.
api_abuse:
  enabled: true
  rules:
    - name: "login-brute-force"
      methods: ["POST"]
      path_prefix: "/rest/user/login"
      # Status code(s) that mean "this attempt failed" for this endpoint.
      failure_status_codes: [401]
      max_failures: 5
      window: 1m
      block_duration: 5m

# Rejects request bodies that don't match an expected JSON Schema for a
# route — catches malformed/unexpected-field requests (e.g. mass
# assignment) that the WAF's attack-signature rules aren't designed to
# catch, since there's no "attack pattern" in a structurally-wrong request.
schema_validation:
  enabled: true
  rules:
    - methods: ["POST"]
      path_prefix: "/rest/user/login"
      schema_file: "configs/schemas/login.json"

rate_limit:
  enabled: true
  # Sustained requests/sec allowed per client IP.
  requests_per_second: 10
  # Burst above the sustained rate allowed in a single instant.
  burst: 20
  # Max simultaneous in-flight requests per client IP (0 disables this check).
  max_concurrent_per_ip: 50
  # How long to keep rate-limit state for an IP after its last request.
  idle_timeout: 10m

logging:
  # Structured JSONL log of every block/allow decision. Feeds the dashboard below.
  events_path: "rampart-events.jsonl"

# Live attack-analytics dashboard (top attackers, block reasons, timeline,
# live event feed). Runs on its OWN port, separate from `listen` above — it
# has no authentication of its own unless oidc.dashboard_auth is enabled
# below, so keep it off a public interface (the 127.0.0.1 default is
# deliberate; don't change it to 0.0.0.0 without either enabling
# oidc.dashboard_auth or putting an authenticating reverse proxy in front).
dashboard:
  enabled: false
  listen: "127.0.0.1:9090"
  # Protects the dashboard's own port, including /auth/login and
  # /auth/callback when OIDC dashboard auth is enabled — separate from the
  # `rate_limit` above, which only covers the main proxy port.
  rate_limit:
    enabled: true
    requests_per_second: 5
    burst: 10
    max_concurrent_per_ip: 10
    idle_timeout: 10m

# Makes Rampart an OIDC relying party / resource server against an
# EXISTING identity provider (Keycloak, Auth0, Okta, ...) — it does not
# replace one. Two independent features share this: dashboard login, and
# role-based enforcement on proxied requests. See docs/OIDC.md.
oidc:
  enabled: false
  issuer_url: "https://keycloak.example.com/realms/myrealm"
  # Dot-path to a []string of role names in the token's claims. Keycloak's
  # realm roles live at "realm_access.roles" (the default). Note: for
  # dashboard login this is read from the ACCESS token, not the ID token —
  # most providers (Keycloak included) don't put authorization claims like
  # roles on the ID token, which is about identity, not permissions.
  roles_claim: "realm_access.roles"

  dashboard_auth:
    enabled: false
    client_id: "rampart-dashboard"
    client_secret: ""
    redirect_url: "http://localhost:9090/auth/callback"
    scopes: ["openid", "profile"]
    # A logged-in user needs at least one of these roles to reach the
    # dashboard. Empty means any authenticated user may in.
    required_roles: ["rampart-dashboard-viewer"]
    # Required, at least 32 bytes, no insecure default: `openssl rand -hex 32`
    session_secret: ""
    session_duration: 8h
    # Where the IdP sends the browser back after RP-Initiated Logout (only
    # used if the provider advertises an end_session_endpoint — Keycloak
    # does). Must be a registered post-logout redirect URI on the client;
    # for Keycloak specifically that's the client's
    # attributes["post.logout.redirect.uris"], not a top-level field —
    # see docs/OIDC.md.
    post_logout_redirect_url: "http://localhost:9090/"

  api_rbac:
    enabled: false
    rules: []
    # - path_prefix: "/admin"
    #   required_roles: ["admin"]
    # - path_prefix: "/api"
    #   required_roles: []   # empty = any valid token is sufficient
