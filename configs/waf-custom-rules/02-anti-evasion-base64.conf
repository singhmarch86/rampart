# Anti-evasion: OWASP CRS at paranoia level 1 does not blindly base64-decode
# every request argument before running SQLi/XSS detection (doing so
# unconditionally causes false positives on legitimate base64 data like
# tokens, images, and file uploads). That's a deliberate tradeoff, but it
# means a trivially base64-encoded attack payload sails through untouched.
#
# Measured via GoTestWAF (see benchmarks/RESULTS.md): 0% of 235 Base64-encoded
# attack payloads were blocked before this rule existed — by far the single
# largest gap found.
#
# This rule closes it narrowly: it decodes each argument and re-runs it
# through the same SQLi/XSS detectors CRS itself uses, so it only fires on
# arguments that are BOTH valid-looking base64 AND decode to something that
# matches a known attack pattern. Harmless base64 (a JWT, an image data URI)
# decodes to bytes that don't match @detectSQLi/@detectXSS, so it passes
# through unaffected — this is why the false-positive rate should not move
# much; re-verify against the false-pos test set after any change here.
SecRule ARGS "@detectSQLi" \
    "id:1000010,\
    phase:2,\
    t:none,t:base64DecodeExt,\
    deny,\
    status:403,\
    log,\
    msg:'Base64-decoded argument matches SQL injection pattern (anti-evasion)',\
    severity:'CRITICAL',\
    tag:'anti-evasion',\
    tag:'base64'"

SecRule ARGS "@detectXSS" \
    "id:1000011,\
    phase:2,\
    t:none,t:base64DecodeExt,\
    deny,\
    status:403,\
    log,\
    msg:'Base64-decoded argument matches XSS pattern (anti-evasion)',\
    severity:'CRITICAL',\
    tag:'anti-evasion',\
    tag:'base64'"

SecRule REQUEST_BODY "@detectSQLi" \
    "id:1000012,\
    phase:2,\
    t:none,t:base64DecodeExt,\
    deny,\
    status:403,\
    log,\
    msg:'Base64-decoded request body matches SQL injection pattern (anti-evasion)',\
    severity:'CRITICAL',\
    tag:'anti-evasion',\
    tag:'base64'"

SecRule REQUEST_BODY "@detectXSS" \
    "id:1000013,\
    phase:2,\
    t:none,t:base64DecodeExt,\
    deny,\
    status:403,\
    log,\
    msg:'Base64-decoded request body matches XSS pattern (anti-evasion)',\
    severity:'CRITICAL',\
    tag:'anti-evasion',\
    tag:'base64'"
