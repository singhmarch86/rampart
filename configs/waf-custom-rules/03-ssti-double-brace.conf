# SSTI: closes finding #9 in docs/FINDINGS.md. OWASP CRS v4 does ship an
# SSTI-adjacent rule (934180, in REQUEST-934-APPLICATION-ATTACK-GENERIC.conf)
# matching `{% ... %}` and `<% ... %>` - but only at paranoia level 2, which
# Rampart doesn't run at by default (PL1). Even at PL2, 934180's own regex
# doesn't match bare `{{ ... }}` at all - the Jinja2/Twig/Mustache/Handlebars
# expression syntax that's the single most common SSTI proof-of-concept
# payload (e.g. the canonical `{{7*7}}` canary), and the one
# scripts/test-attacks.sh found sailing through untouched. Confirmed by
# reading the actual vendored rule source
# (coraza-coreruleset/v4@v4.25.0/rules/@owasp_crs/REQUEST-934-APPLICATION-ATTACK-GENERIC.conf),
# not assumed.
#
# This rule closes that specific gap, active regardless of paranoia level
# (matching how the base64 anti-evasion rule in 02- is also PL-independent).
# Narrowed on purpose: it requires an arithmetic operator OR a known
# reflection/RCE primitive (__class__, __import__, self., config., request.,
# constructor., exec(, system(, popen(, __proto__) inside the braces, not
# just any `{{...}}`. A bare `{{ }}`-shaped legitimate value - a Vue/Angular
# template string, `{{user.name}}` in submitted form/bio text - has neither
# and passes through unaffected; verified both ways below before shipping.
SecRule ARGS|XML:/* "@rx \{\{[^{}]*(?:[+\-*/%]|__class__|__import__|__globals__|__subclasses__|__proto__|self\.|config\.|request\.|constructor\.|exec\(|system\(|popen\()[^{}]*\}\}" \
    "id:1000014,\
    phase:2,\
    t:none,\
    deny,\
    status:403,\
    log,\
    msg:'Argument matches server-side template injection pattern (double-brace expression)',\
    severity:'CRITICAL',\
    tag:'ssti'"

SecRule REQUEST_BODY "@rx \{\{[^{}]*(?:[+\-*/%]|__class__|__import__|__globals__|__subclasses__|__proto__|self\.|config\.|request\.|constructor\.|exec\(|system\(|popen\()[^{}]*\}\}" \
    "id:1000015,\
    phase:2,\
    t:none,\
    deny,\
    status:403,\
    log,\
    msg:'Request body matches server-side template injection pattern (double-brace expression)',\
    severity:'CRITICAL',\
    tag:'ssti'"

# Finding #15: the rules above only cover `{{ }}`. The other two common
# template syntaxes - `{% ... %}` statement blocks (Jinja2/Twig/Liquid) and
# `<% ... %>` / `<%= ... %>` tags (ERB/JSP/EJS) - were only covered by CRS
# rule 934180 at paranoia level 2, so at the default level 1 they sailed
# through (verified: both returned 200). Same narrow design as above: it
# requires an arithmetic operator, a known reflection/RCE primitive, or a
# statement that pulls in other code (import/include/extends) INSIDE the
# tags, so a bare mention like "use {% tags %}" or a stray `<% %>` in
# ordinary text doesn't match. An operator only counts when it sits
# BETWEEN two operands (`7*7`, `7 * 7`, `7*'7'`), so the marker characters
# after an opener (`<%=`, `<%-`, `{%-`) aren't mistaken for an operator. (A
# first attempt that tried to "consume the marker first" didn't work: the
# regex engine just matched the `-` as an operator instead, and wrongly
# blocked `<%- name %>`; found by the test below.)
SecRule ARGS|XML:/* "@rx (?:\{%[-+~]?[^%]*?(?:[\w)\]'\x22]\s*[+\-*/]\s*[\w('\x22\[]|__class__|__import__|__globals__|__subclasses__|__proto__|self\.|config\.|request\.|constructor\.|exec\(|system\(|popen\(|\b(?:import|include|extends)\b)[^%]*?[-+~]?%\}|<%[=\-_#~]?[^%]*?(?:[\w)\]'\x22]\s*[+\-*/]\s*[\w('\x22\[]|__class__|__import__|__globals__|__subclasses__|__proto__|self\.|config\.|request\.|constructor\.|exec\(|system\(|popen\(|Runtime\b|\b(?:import|include)\b)[^%]*?%>)" \
    "id:1000016,\
    phase:2,\
    t:none,\
    deny,\
    status:403,\
    log,\
    msg:'Argument matches server-side template injection pattern ({% %} or <% %> tag)',\
    severity:'CRITICAL',\
    tag:'ssti'"

SecRule REQUEST_BODY "@rx (?:\{%[-+~]?[^%]*?(?:[\w)\]'\x22]\s*[+\-*/]\s*[\w('\x22\[]|__class__|__import__|__globals__|__subclasses__|__proto__|self\.|config\.|request\.|constructor\.|exec\(|system\(|popen\(|\b(?:import|include|extends)\b)[^%]*?[-+~]?%\}|<%[=\-_#~]?[^%]*?(?:[\w)\]'\x22]\s*[+\-*/]\s*[\w('\x22\[]|__class__|__import__|__globals__|__subclasses__|__proto__|self\.|config\.|request\.|constructor\.|exec\(|system\(|popen\(|Runtime\b|\b(?:import|include)\b)[^%]*?%>)" \
    "id:1000017,\
    phase:2,\
    t:none,\
    deny,\
    status:403,\
    log,\
    msg:'Request body matches server-side template injection pattern ({% %} or <% %> tag)',\
    severity:'CRITICAL',\
    tag:'ssti'"
