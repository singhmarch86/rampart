# Example custom rule: block requests to internal-only admin paths that
# should never be reachable through the public reverse proxy, regardless of
# whether the request otherwise looks "clean" to CRS's attack pattern rules.
SecRule REQUEST_URI "@beginsWith /internal-admin/" \
    "id:1000001,\
    phase:1,\
    deny,\
    status:404,\
    log,\
    msg:'Blocked request to internal-only path',\
    severity:'CRITICAL'"
