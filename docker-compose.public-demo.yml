# Standalone public-demo stack: Rampart in front of the bundled OWASP
# Juice Shop target, dashboard exposed to the public internet. See
# docs/PUBLIC_DEMO.md before using this — it's for a standalone public
# demo, never for a deployment protecting a real application.
#
# Deliberately a full standalone file rather than a docker-compose.yml
# overlay: an earlier attempt in this project to override a list field
# (ports) via a second -f file didn't reliably merge as expected (see
# docs/FINDINGS.md-adjacent notes in this file's history) - a standalone
# file avoids that whole class of surprise.
#
#   docker compose -f docker-compose.public-demo.yml up -d --build
#
services:
  rampart:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./configs/rampart.demo-public.yaml:/app/configs/rampart.yaml:ro
      - ./configs/waf-custom-rules:/app/configs/waf-custom-rules:ro
      - ./configs/schemas:/app/configs/schemas:ro
      - rampart-data:/data
    depends_on:
      - juice-shop
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    restart: unless-stopped

volumes:
  rampart-data:
