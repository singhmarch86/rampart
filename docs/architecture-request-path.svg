<svg width="680" height="890" viewBox="0 0 680 890" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Rampart request path architecture</title>
<desc>A vertical flowchart showing how an incoming HTTP request passes through Rampart's layers in order: IP filter, rate limiter, optional OIDC RBAC guard, API-abuse guard, schema validation, and WAF, before reaching the protected upstream application.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="890" fill="#FFFFFF"/>

<line x1="340" y1="84" x2="340" y2="120" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="180" x2="340" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="276" x2="340" y2="312" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="372" x2="340" y2="408" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="468" x2="340" y2="504" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="564" x2="340" y2="600" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="660" x2="340" y2="696" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="756" x2="340" y2="792" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="40" width="240" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Client / attacker</text>
</g>

<g>
<rect x="220" y="124" width="240" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">IP filter</text>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Allow / deny lists</text>
</g>

<g>
<rect x="220" y="220" width="240" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Rate limiter</text>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Per-IP rate &amp; concurrency</text>
</g>

<g>
<rect x="220" y="316" width="240" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">OIDC RBAC guard</text>
<text x="340" y="356" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Optional role check</text>
</g>

<g>
<rect x="220" y="412" width="240" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="430" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">API-abuse guard</text>
<text x="340" y="452" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Brute-force lockout</text>
</g>

<g>
<rect x="220" y="508" width="240" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="526" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Schema validation</text>
<text x="340" y="548" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Blocks mass assignment</text>
</g>

<g>
<rect x="220" y="604" width="240" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="622" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">WAF</text>
<text x="340" y="644" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Coraza + OWASP CRS</text>
</g>

<g>
<rect x="220" y="700" width="240" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="718" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Reverse proxy</text>
<text x="340" y="740" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Forwards to upstream</text>
</g>

<g>
<rect x="220" y="796" width="240" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="818" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Upstream app</text>
</g>

<rect x="220" y="856" width="12" height="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="238" y="862" dominant-baseline="central" font-size="12" fill="#444441">external</text>
<rect x="320" y="856" width="12" height="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="338" y="862" dominant-baseline="central" font-size="12" fill="#444441">rampart component</text>
</svg>
