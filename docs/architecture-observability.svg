<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Rampart observability architecture</title>
<desc>A structural diagram showing how blocked-request events flow from Rampart's detection layers into an event log, which feeds both a live analytics dashboard and an offline rampart-analyze CLI tool that can optionally narrate a summary using an LLM.</desc>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/>

<line x1="340" y1="84" x2="340" y2="120" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<path d="M 280 176 L 280 220 L 140 220 L 140 256" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<path d="M 400 176 L 400 220 L 540 220 L 540 256" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="140" y1="312" x2="140" y2="348" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="540" y1="312" x2="540" y2="348" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
<rect x="220" y="40" width="240" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Rampart's detection layers</text>
</g>

<g>
<rect x="220" y="124" width="240" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Event log</text>
<text x="340" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">JSONL, one line per block</text>
</g>

<g>
<rect x="20" y="256" width="240" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Analytics dashboard</text>
<text x="140" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Live, in-process</text>
</g>

<g>
<rect x="420" y="256" width="240" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="540" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">rampart-analyze</text>
<text x="540" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Offline, separate binary</text>
</g>

<g>
<rect x="20" y="348" width="240" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="370" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Browser dashboard</text>
</g>

<g>
<rect x="420" y="348" width="240" height="44" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="540" y="370" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Triage report</text>
</g>
</svg>
