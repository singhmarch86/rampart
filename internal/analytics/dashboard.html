<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rampart — Attack Analytics</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-border: #232a38;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --accent: #5b8cff;
    --danger: #ff5b6e;
    --warn: #ffb454;
    --ok: #3ddc84;
    --layer-ipfilter: #5b8cff;
    --layer-ratelimit: #ffb454;
    --layer-waf: #ff5b6e;
    --layer-apiabuse: #c792ea;
    --layer-schema: #3ddc84;
    --layer-hostguard: #4dd0e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .meta { color: var(--text-dim); font-size: 12px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px 16px; }
  .tile .n { font-size: 26px; font-weight: 700; }
  .tile .l { color: var(--text-dim); font-size: 12px; margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
  .layer-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--text-dim); font-style: italic; padding: 8px 0; }
  .timeline { display: flex; align-items: flex-end; gap: 2px; height: 80px; }
  .bar { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 1px; }
  .feed { max-height: 360px; overflow-y: auto; font-size: 12px; }
  .feed-row { display: grid; grid-template-columns: 70px 90px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--panel-border); align-items: baseline; }
  .feed-row .t { color: var(--text-dim); }
  .feed-row .layer { font-weight: 600; }
  .feed-row .reason { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  code { background: #1c2230; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  .public-notice { background: #2a1f0d; border: 1px solid #5a3f14; color: #ffb454; border-radius: 8px; padding: 10px 14px; font-size: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
  <!--PUBLIC_NOTICE-->
  <header>
    <h1>Rampart — Attack Analytics</h1>
    <div class="meta"><span class="status-dot" id="statusDot"></span><span id="metaText">connecting…</span></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="panel" style="margin-bottom:16px">
    <h2>Blocks per minute (last hour)</h2>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Top attacker IPs</h2>
      <table id="attackersTable"><thead><tr><th>IP</th><th class="num">Blocks</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="panel">
      <h2>Top block reasons</h2>
      <table id="reasonsTable"><thead><tr><th>Layer</th><th>Reason</th><th class="num">Count</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="panel">
    <h2>Live event feed</h2>
    <div class="feed" id="feed"></div>
  </div>

<script>
const LAYER_COLOR = {
  ipfilter: 'var(--layer-ipfilter)',
  ratelimit: 'var(--layer-ratelimit)',
  waf: 'var(--layer-waf)',
  apiabuse: 'var(--layer-apiabuse)',
  schema: 'var(--layer-schema)',
  hostguard: 'var(--layer-hostguard)',
};

function layerDot(layer) {
  const c = LAYER_COLOR[layer] || 'var(--text-dim)';
  return `<span class="layer-dot" style="background:${c}"></span>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function render(stats) {
  document.getElementById('metaText').textContent =
    `${stats.total_events} blocks since ${new Date(stats.started_at).toLocaleString()}`;

  const tiles = document.getElementById('tiles');
  const layers = Object.keys(stats.by_layer || {}).sort();
  tiles.innerHTML = layers.length ? layers.map(l => `
    <div class="tile">
      <div class="n">${stats.by_layer[l]}</div>
      <div class="l">${layerDot(l)}${escapeHtml(l)}</div>
    </div>
  `).join('') : '<div class="tile"><div class="n">0</div><div class="l">no blocks yet</div></div>';
  if (stats.would_block > 0) {
    // Detect mode (waf.mode: detect): requests the WAF would have blocked but let through.
    tiles.innerHTML += `<div class="tile"><div class="n">${stats.would_block}</div><div class="l">would block (detect mode)</div></div>`;
  }

  const buckets = stats.timeline || [];
  const max = Math.max(1, ...buckets.map(b => b.count));
  const timeline = document.getElementById('timeline');
  if (buckets.length === 0) {
    timeline.innerHTML = '<div class="empty">No blocks in the last hour.</div>';
  } else {
    timeline.innerHTML = buckets.map(b => {
      const h = Math.max(2, Math.round((b.count / max) * 76));
      const label = new Date(b.minute).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      return `<div class="bar" style="height:${h}px" title="${label}: ${b.count}"></div>`;
    }).join('');
  }

  const attackersBody = document.querySelector('#attackersTable tbody');
  const attackers = stats.top_attackers || [];
  attackersBody.innerHTML = attackers.length
    ? attackers.map(a => `<tr><td><code>${escapeHtml(a.ip)}</code></td><td class="num">${a.count}</td></tr>`).join('')
    : '<tr><td colspan="2" class="empty">No blocked IPs yet.</td></tr>';

  const reasonsBody = document.querySelector('#reasonsTable tbody');
  const reasons = stats.top_reasons || [];
  reasonsBody.innerHTML = reasons.length
    ? reasons.map(r => `<tr><td>${layerDot(r.layer)}${escapeHtml(r.layer)}</td><td>${escapeHtml(r.reason)}</td><td class="num">${r.count}</td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">No blocks recorded yet.</td></tr>';

  const feed = document.getElementById('feed');
  const events = (stats.recent_events || []).slice(0, 50);
  feed.innerHTML = events.length ? events.map(e => `
    <div class="feed-row">
      <span class="t">${new Date(e.time).toLocaleTimeString()}</span>
      <span class="layer">${layerDot(e.layer)}${escapeHtml(e.layer)}</span>
      <span class="reason" title="${escapeHtml(e.reason)}"><code>${escapeHtml(e.client_ip)}</code> ${escapeHtml(e.method)} ${escapeHtml(e.path)} — ${e.action === 'detect' ? '[would block] ' : ''}${escapeHtml(e.reason)}</span>
    </div>
  `).join('') : '<div class="empty">No events yet — traffic will appear here as Rampart blocks it.</div>';
}

function connect() {
  const es = new EventSource('/api/stream');
  const dot = document.getElementById('statusDot');
  es.onopen = () => { dot.style.background = 'var(--ok)'; };
  es.onerror = () => { dot.style.background = 'var(--danger)'; };
  es.onmessage = (ev) => {
    try { render(JSON.parse(ev.data)); } catch (e) { console.error(e); }
  };
}

connect();
</script>
</body>
</html>
